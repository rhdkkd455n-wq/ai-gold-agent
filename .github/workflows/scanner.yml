name: XAUUSD AI Auto Scanner

on:
  schedule:
    - cron: '2 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-market:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: pip install -r requirements.txt

      # BƯỚC 1: CHẠY HOÀN TẤT BOT 1 TRƯỚC
      - name: Chạy Bot 1 (H1/H4 TraderViet & Vĩ mô)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python xauusd_agent.py
          git add trade_state.json || true
          git commit -m "Cap nhat Bot 1" || true
          git push || true

      # NGHỈ 5 GIÂY ĐỂ XẢ BỘ ĐỆM MẠNG VÀ TOKEN
      - name: Nghỉ đệm 5 giây
        run: sleep 5

      # BƯỚC 2: SAU KHI BOT 1 XONG MỚI CHẠY TIẾP BOT 3
      - name: Chạy Bot 3 (Volume Profile & Order Flow)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BOT3_TELEGRAM_TOKEN: ${{ secrets.BOT3_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python bot3_agent.py
          git add bot3_state.json || true
          git commit -m "Cap nhat Bot 3" || true
          git push || true
