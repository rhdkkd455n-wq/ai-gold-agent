name: XAUUSD AI Auto Scanner

on:
  workflow_dispatch: # Chỉ chạy khi cron-job.org gọi đúng giờ, dẹp bỏ lịch trễ của GitHub

permissions:
  contents: write

jobs:
  # ================= MÁY CHỦ 1: CHẠY RIÊNG BOT 1 =================
  bot1-traderviet:
    name: Bot 1 (TraderViet H1/H4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Chạy Bot 1
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python xauusd_agent.py
          git add trade_state.json || true
          git commit -m "Cap nhat Bot 1" || true
          git push || true

  # ================= MÁY CHỦ 2: CHẠY RIÊNG BOT 2 =================
  bot2-tjr:
    name: Bot 2 (TJR M15 Sniper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Chạy Bot 2
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TJR_BOT_TOKEN: ${{ secrets.TJR_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python tjr_agent.py

  # ================= MÁY CHỦ 3: CHẠY RIÊNG BOT 3 =================
  bot3-orderflow:
    name: Bot 3 (Volume Profile & Order Flow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Chạy Bot 3
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BOT3_TELEGRAM_TOKEN: ${{ secrets.BOT3_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python bot3_agent.py
          git add bot3_state.json || true
          git commit -m "Cap nhat Bot 3" || true
          git push || true
