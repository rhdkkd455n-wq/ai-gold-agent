name: Agentic Backtest & Dashboard Sync

on:
  schedule:
    - cron: '15 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pandas numpy
      - name: Run Backtest
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python backtest_engine.py
      - name: Push Data
        run: |
          git config --global user.name "Agentic Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add dashboard_data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update dashboard"
          git push
