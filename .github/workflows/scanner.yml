name: XAUUSD AI Auto Scanner

on:
  schedule:
    - cron: '2 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write  # Cấp quyền để bot tự lưu trạng thái theo dõi TP1, TP2

jobs:
  scan-market:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: pip install -r requirements.txt

      - name: Chạy Bot theo dõi Vàng & TP Tracker
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python xauusd_agent.py
          git add trade_state.json || true
          git commit -m "Cap nhat trang thai lenh" || true
          git push || true
