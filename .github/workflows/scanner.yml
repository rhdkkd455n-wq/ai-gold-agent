name: XAUUSD AI Auto Scanner

on:
  schedule:
    # Tự động chạy ngầm mỗi 1 tiếng (vào phút thứ 2), từ Thứ 2 đến Thứ 6
    - cron: '2 * * * 1-5'
  workflow_dispatch: # Cho phép bấm nút quét tay bất cứ lúc nào

jobs:
  scan-market:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: pip install -r requirements.txt

      - name: Chạy Groq AI quét thị trường
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python xauusd_agent.py
